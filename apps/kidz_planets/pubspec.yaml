name: kidz_planets
description: An interactive 3D solar system for young explorers.
publish_to: none
version: 1.0.0+1

# The app is a workspace member, so it inherits the single dependency
# resolution declared at the repository root.
resolution: workspace

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Feature packages. The app composes these and owns no feature logic.
  core:
  planets:
  moon:
  avatar:
  mission:

  # Dependency injection. GetIt owns registration; Riverpod owns reactive
  # state. The two are never used interchangeably.
  get_it: ^9.2.1
  flutter_riverpod: ^2.6.1

  # Direct use is confined to the composition root.
  flutter_scene: ^0.23.0
  vector_math: ^2.4.2
  collection: ^1.19.1

  # Imported directly by hook/build.dart. It arrives transitively through
  # flutter_scene, but a direct import needs its own declaration. Declared as a
  # regular dependency rather than a dev one because the analyzer does not
  # accept a dev_dependency for an import outside test/, and the build hook runs
  # during `flutter build`, which reads this section.
  hooks: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Used directly by the controller tests to drive the toast, spin-hint and
  # flight-style timers without waiting in real time.
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
  generate: true
  # Assets live at the repository root so every package resolves them through
  # one tree; the app is the only package that bundles them.
  assets:
    - ../../flutter_scene_generated/
    - ../../assets/textures/
    - ../../assets/textures/moons/
    - ../../assets/audio/narration/planets/
    - ../../assets/audio/narration/hotspots/
    # Indonesian narration. The folders ship empty until the recordings land;
    # the catalog falls back to the English files above until then.
    - ../../assets/audio/narration/id/planets/
    - ../../assets/audio/narration/id/hotspots/
    - ../../assets/audio/sfx/planets/
    - ../../assets/audio/sfx/missions/
    - ../../assets/audio/sfx/avatar/
    - ../../assets/models/avatar/