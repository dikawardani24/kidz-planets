name: kidz_planets
description: An interactive 3D solar system for young explorers.
publish_to: none
version: 1.0.0+1

# The app is a workspace member, so it inherits the single dependency
# resolution declared at the repository root.
resolution: workspace

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Feature packages. The app composes these and owns no feature logic.
  core:
  planets:
  avatar:
  mission:

  # Dependency injection. GetIt owns registration; Riverpod owns reactive
  # state. The two are never used interchangeably.
  get_it: ^9.2.1
  flutter_riverpod: ^2.6.1

  # Value equality for the shell's state objects, so a rebuild only happens
  # when a field actually changed.
  equatable: ^2.0.7

  # Key-value persistence for the child's chosen avatar. The avatar feature
  # owns the selection state behind an injectable store; this is the
  # SharedPreferences-backed store the app installs at startup.
  shared_preferences: ^2.5.5

  # The audio session the app configures at startup, so the child's own audio
  # keeps playing alongside the solar system.
  audio_session: ^0.2.4

  # Direct use is confined to the composition root.
  flutter_scene: ^0.23.0
  vector_math: ^2.4.2
  collection: ^1.19.1

  # Imported directly by hook/build.dart. It arrives transitively through
  # flutter_scene, but a direct import needs its own declaration. Declared as a
  # regular dependency rather than a dev one because the analyzer does not
  # accept a dev_dependency for an import outside test/, and the build hook runs
  # during `flutter build`, which reads this section.
  hooks: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Used directly by the controller tests to drive the toast, spin-hint and
  # flight-style timers without waiting in real time.
  fake_async: ^1.3.3
  # The sound tests assert on the player type the feature packages build their
  # catalogs from, so they name it directly.
  just_audio: ^0.10.6

flutter:
  uses-material-design: true
  # Fredoka, the prototype's font (`font-family: 'Fredoka'` in intro.html).
  # Scoped to the intro screen's DefaultTextStyle: the Explorer keeps the
  # default type ramp, so the loading screen reads like the mock without
  # re-skinning everything else.
  fonts:
    - family: Fredoka
      fonts:
        - asset: assets/fonts/Fredoka-Regular.ttf
          weight: 400
        - asset: assets/fonts/Fredoka-Medium.ttf
          weight: 500
        - asset: assets/fonts/Fredoka-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Fredoka-Bold.ttf
          weight: 700
  # The runnable app is the only package that bundles assets, so the tree lives
  # here. Every entry is package-relative on purpose: a path written as
  # `../../assets/...` keeps the `../../` in the bundle key, and nothing that
  # asks for `assets/textures/earth.png` would find it.
  assets:
    - flutter_scene_generated/
    - assets/textures/
    - assets/textures/moons/
    - assets/audio/narration/planets/
    - assets/audio/narration/hotspots/
    # Indonesian narration. The folders ship empty until the recordings land;
    # the catalog falls back to the English files above until then.
    - assets/audio/narration/id/planets/
    - assets/audio/narration/id/hotspots/
    - assets/audio/sfx/planets/
    - assets/audio/sfx/missions/
    - assets/audio/sfx/avatar/
    - assets/models/avatar/