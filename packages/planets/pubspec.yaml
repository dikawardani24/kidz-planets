name: planets
description: >-
  The Sun, the eight planets, the solar-system scene and the Explorer: rotation,
  orbit, zoom, focus, labels and planet audio.
version: 1.0.0+1
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  core:
  equatable: ^2.0.7
  flutter_riverpod: ^2.6.1
  just_audio: ^0.10.6
  audio_session: ^0.2.4
  flutter_scene: ^0.23.0
  vector_math: ^2.4.2
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # The controller tests drive the toast and spin-hint timers directly instead
  # of waiting for them, which is the only way to assert on their timing.
  fake_async: ^1.3.3
