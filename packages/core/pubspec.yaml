name: core
description: >-
  Shared infrastructure for Kidz Planets: localization, theme, audio and
  utility abstractions. Depends on no feature package and contains no feature
  business logic.
version: 1.0.0+1
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  equatable: ^2.0.7
