name: kidz_planets
description: An interactive 3D solar system for young explorers.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  flutter_scene: ^0.23.0
  vector_math: ^2.4.2
  equatable: ^2.0.7
  collection: ^1.19.1
  flutter_tts: ^4.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/textures/
