name: kidz_planets_workspace
description: >-
  Melos workspace root for Kidz Planets, an interactive 3D solar system for
  young explorers. The app composes feature packages; feature packages depend
  on core only. This package holds no source: it exists so the workspace can be
  bootstrapped, analyzed, formatted and tested as a single unit.

publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.13.2

# Pub workspace: one dependency resolution for the whole monorepo, so a version
# is bumped once here rather than repeated across seven manifests. Every member
# sets `resolution: workspace` and inherits this graph.
workspace:
  - apps/*
  - packages/*

dev_dependencies:
  melos: ^8.9.0

melos:
  # Only the members below are part of the workspace. The generated
  # flutter_scene_generated/ tree is build output and must never be a package.
  packages:
    - apps/*
    - packages/*

  ide:
    intellij:
      enabled: true
      moduleNamePrefix: kidz_

  scripts:
    analyze:
      description: Analyze every package for errors and lints.
      run: melos exec --fail-fast --concurrency=1 -- "flutter analyze"

    # Serial, because `flutter` takes a single startup lock per SDK and a
    # parallel run fails five packages at once on "waiting for another flutter
    # command to release the startup lock" rather than on anything in the code.
    test:
      description: Run the unit and widget tests of every package.
      run: melos exec --fail-fast --concurrency=1 -- "flutter test"

    format:
      description: Format every package.
      run: melos exec -- "dart format ."

    format:check:
      description: Fail if any package is not formatted.
      run: melos exec --fail-fast -- "dart format --output=none --set-exit-if-changed ."

    # The ARB sources and l10n.yaml live in core, because every feature package
    # resolves copy and the generated delegate has to sit downstream of them all.
    # flutter_scene compiles GLB and scene assets through a build hook that runs
    # on the app, so there is nothing to invoke for assets.
    gen:
      description: Run Flutter code generation (localizations).
      run: melos exec --scope=core -- "flutter gen-l10n"

    # Guards the dependency direction the architecture depends on. A feature
    # package importing another feature package, or any package importing an
    # app package, is an architecture violation and fails this check.
    check:deps:
      description: Verify no feature package imports another feature package.
      run: dart run tool/check_package_deps.dart

    check:
      description: Dependency rules, format check, analyze and test.
      run: melos run check:deps && melos run format:check && melos run analyze && melos run test

    upgrade:
      description: Upgrade every dependency in every package.
      run: melos exec -- "flutter pub upgrade"